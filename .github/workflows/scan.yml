name: MOMENTUM auto scan
on:
  schedule:
    - cron: '0 13-23 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: momentum-scan
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas lxml
      - run: python thunder_screener.py || true
      - run: |
          mkdir -p site
          cp dashboard.html site/index.html
          cp -f _headers site/ 2>/dev/null || true
          touch site/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
