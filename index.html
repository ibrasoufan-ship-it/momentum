<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ MOMENTUM</title>
<style>
  :root{
    --bg:#f5f5f7; --card:#ffffff; --line:#e8e8ed;
    --txt:#1d1d1f; --dim:#6e6e73; --dim2:#86868b;
    --green:#34c759; --green-soft:#e8f8ee;
    --amber:#ff9500; --amber-soft:#fff4e5;
    --red:#ff3b30;  --red-soft:#ffeceb;
    --gray:#8e8e93; --gray-soft:#f2f2f7;
    --blue:#007aff;
    --shadow:0 2px 14px rgba(0,0,0,.07);
  }
  *{box-sizing:border-box;margin:0;padding:0;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,sans-serif}
  body{background:var(--bg);color:var(--txt);min-height:100vh;padding-bottom:80px;
    font-size:18px;-webkit-font-smoothing:antialiased}
  header{padding:52px 24px 16px;text-align:center;position:relative}
  header h1{font-size:46px;font-weight:700;letter-spacing:-.5px}
  header p{color:var(--dim);font-size:20px;margin-top:12px}
  .langbtn{position:absolute;top:20px;inset-inline-start:24px;background:var(--card);
    border:1px solid var(--line);border-radius:22px;padding:10px 22px;font-size:18px;
    font-weight:700;cursor:pointer;box-shadow:var(--shadow)}
  .dot{display:inline-block;width:13px;height:13px;border-radius:50%;
    margin-inline-end:8px;animation:pulse 1.6s infinite;vertical-align:middle}
  .d-g{background:#34c759}.d-a{background:#ff9500}.d-r{background:#ff3b30}
  .demo-banner{background:var(--amber-soft);border:1px solid #ffd699;color:#b36b00;
    text-align:center;padding:16px 22px;font-size:19px;margin:22px auto 0;max-width:900px;
    border-radius:16px;line-height:1.7}
  nav{display:flex;justify-content:center;gap:14px;margin:30px 0 10px}
  nav button{background:var(--card);color:var(--dim);border:1px solid var(--line);
    padding:16px 42px;border-radius:32px;font-size:22px;cursor:pointer;transition:.2s;
    box-shadow:var(--shadow)}
  nav button.on{background:var(--txt);color:#fff;border-color:var(--txt);font-weight:700}
  .chips{display:flex;justify-content:center;gap:12px;margin:22px 0 6px;flex-wrap:wrap}
  .chips button{background:var(--card);border:1px solid var(--line);color:var(--dim);
    padding:11px 26px;border-radius:24px;font-size:18px;cursor:pointer}
  .chips button.on{color:var(--txt);border-color:var(--txt);font-weight:700}
  .sel{background:var(--card);border:1px solid var(--line);color:var(--txt);
    padding:11px 18px;border-radius:24px;font-size:17px;cursor:pointer;font-weight:600}
  .ind{color:var(--dim2);font-size:16px;margin-top:3px;max-width:230px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  main{max-width:1280px;margin:18px auto;padding:0 20px;display:grid;
    grid-template-columns:repeat(auto-fill,minmax(390px,1fr));gap:22px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px;
    transition:.15s;box-shadow:var(--shadow);position:relative;overflow:visible}
  .stkr{position:absolute;top:-13px;inset-inline-end:18px;background:#fff4e5;color:#b36b00;
    border:1.5px solid #ffd699;border-radius:14px;padding:7px 16px;font-size:16px;
    font-weight:800;box-shadow:var(--shadow);z-index:2}
  .stkr.hot{background:#ffeceb;color:#c22;border-color:#ffb3ae;animation:pulse 1.1s infinite}
  .favbtn{background:none;border:none;font-size:26px;cursor:pointer;color:#d1d1d6;
    transition:.15s;line-height:1;vertical-align:middle;margin-inline-start:8px;padding:0}
  .favbtn:hover{transform:scale(1.25)}
  .favbtn.on{color:#f5b400}
  .tickrow{display:flex;align-items:center;gap:2px}
  .card:hover{transform:translateY(-3px)}
  .card .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .tick{font-size:34px;font-weight:800;letter-spacing:.3px}
  .px{font-size:22px;font-weight:800;margin-top:6px}
  .px .pct{font-size:17px;font-weight:700}
  .px.up{color:#1d8b3f} .px.down{color:#d70015}
  .livedot{color:#34c759;font-size:12px;animation:pulse 1.4s infinite;vertical-align:middle}
  .nm{color:var(--dim);font-size:17px;margin-top:5px;max-width:220px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .badge{padding:10px 20px;border-radius:20px;font-size:18px;font-weight:700}
  .b-launch{background:var(--green-soft);color:#1d8b3f}
  .b-watch{background:var(--amber-soft);color:#b36b00}
  .b-wait{background:var(--gray-soft);color:var(--dim)}
  .b-ext{background:var(--red-soft);color:#c22}
  .b-loaded{background:#ffe6f2;color:#c0166b}
  .ring{position:relative;width:116px;height:116px;flex-shrink:0}
  .ring svg{transform:rotate(-90deg)}
  .ring .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:800}
  .mid{display:flex;align-items:center;gap:22px;margin:18px 0 8px}
  .chkwrap{flex:1}
  .chk{display:flex;flex-direction:column;gap:7px}
  .chkitem{font-size:17px;color:var(--dim);font-weight:600;display:flex;align-items:center;gap:8px}
  .chkitem.ok{color:#1b8b3f}
  .chkitem::first-letter{font-size:19px}
  .rare{font-size:16px;font-weight:800;color:#b8860b;margin-top:6px;
    background:#fdf3d0;border-radius:12px;padding:4px 12px;display:inline-block;animation:pulse 1.6s infinite}
  .exc{font-size:16px;font-weight:800;color:#b36b00;margin-top:6px;
    background:#fff0d9;border-radius:12px;padding:4px 12px;display:inline-block}
  .mcap{font-size:15px;color:var(--dim2);margin-top:10px}
  .mcap b{color:var(--txt)}
  .meta2{font-size:19px;color:var(--dim);margin:8px 0}
  .meta2 b{color:var(--txt)}
  .meta{font-size:19px;color:var(--dim);line-height:2}
  .meta b{color:var(--txt);font-weight:650}
  .sigs{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .sigs div{font-size:18px;line-height:2;color:#3a3a3c}
  .sigs div::before{content:"⚡";margin-inline-start:0;margin-inline-end:8px;font-size:15px}
  .bars{display:flex;gap:8px;margin-top:16px}
  .bar{flex:1;text-align:center}
  .bar .t{height:7px;background:var(--gray-soft);border-radius:4px;overflow:hidden}
  .bar .t i{display:block;height:100%;background:var(--blue);border-radius:4px}
  .bar span{font-size:14px;color:var(--dim2);display:block;margin-top:6px}
  /* ---------- عدادات السلع ---------- */
  .gcard{background:var(--card);border:1px solid var(--line);border-radius:22px;
    padding:30px 26px;text-align:center;box-shadow:var(--shadow)}
  .gname{font-size:30px;font-weight:800;margin-bottom:4px}
  .gprice{color:var(--dim);font-size:19px;margin-bottom:10px}
  .gprice b{color:var(--txt)}
  .gauge-wrap{position:relative;width:280px;margin:0 auto}
  .gstate{font-size:26px;font-weight:800;margin-top:-34px}
  .s-up{color:var(--green)} .s-down{color:var(--red)} .s-flat{color:var(--gray)}
  .rev{display:inline-block;background:var(--amber-soft);color:#b36b00;font-size:17px;
    font-weight:700;padding:8px 18px;border-radius:18px;margin-top:12px;
    animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  .ref{display:inline-block;font-size:20px;margin-inline-start:6px}
  .ref.spin{animation:spin .8s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .plan{margin-top:14px;padding:12px 16px;border-radius:13px;font-size:17px;font-weight:700;
    background:#e8f8ee;color:#1d8b3f;line-height:1.9;text-align:start}
  .sigbar{display:flex;gap:6px;margin-top:16px;direction:ltr}
  .sigbar i{flex:1;height:13px;border-radius:7px;opacity:.22;transition:.3s}
  .sigbar i.on{opacity:1;transform:scaleY(1.7)}
  .siglabel{font-size:24px;font-weight:800;margin-top:10px;text-align:center}
  .sigpulse{animation:pulse 1.1s infinite}
  .eta{margin-top:14px;padding:11px 16px;border-radius:13px;font-size:18px;font-weight:700;text-align:center}
  .eta-go{background:#e8f8ee;color:#1d8b3f}
  .eta-near{background:#fff4e5;color:#b36b00}
  .eta-far{background:#f2f2f7;color:#6e6e73}
  .outlook{background:#eef4ff;color:#0a58c2;font-size:17.5px;font-weight:600;
    padding:12px 16px;border-radius:14px;margin-top:14px;line-height:1.9;text-align:start}
  .gnote{color:var(--dim);font-size:18px;margin-top:16px;line-height:1.9;
    border-top:1px solid var(--line);padding-top:14px}
  .offline{opacity:.65}
  .offline .gauge-wrap{filter:grayscale(1)}
  .tvbtn{display:block;width:100%;text-align:center;margin-top:16px;padding:14px 0;
    background:var(--gray-soft);color:var(--txt);border:none;border-radius:14px;
    font-size:19px;font-weight:700;cursor:pointer;text-decoration:none;transition:.15s}
  .tvbtn:hover{background:#e5e5ea}
  footer{text-align:center;color:var(--dim2);font-size:16px;margin-top:44px;
    padding:0 24px;line-height:2}
  .empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:60px 0;font-size:22px}
  .anhead{grid-column:1/-1;font-size:28px;font-weight:800;margin:18px 4px 2px}
  .annote{font-size:16px;font-weight:400;color:var(--dim2);margin-top:6px}
  .chiprow{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .chip{background:var(--gray-soft);border-radius:14px;padding:9px 16px;font-size:17px;
    font-weight:700;text-decoration:none;color:var(--txt)}
  .chip:hover{background:#e5e5ea}
  .chip b{margin-inline-start:4px}
  .cbig span{color:var(--dim);font-weight:400;font-size:15px}
  .satbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;
    font-size:17px;text-align:start}
  .tvq{margin:10px 0 4px;min-height:70px;border-radius:14px;overflow:hidden;
    background:var(--gray-soft)}
  .stale{background:var(--amber-soft);color:#b36b00;font-size:15.5px;font-weight:600;
    padding:10px 14px;border-radius:12px;margin-top:12px;line-height:1.8;text-align:start}
</style>
</head>
<body>
<header>
  <button class="langbtn" id="langBtn" onclick="toggleLang()">EN</button>
  <h1 id="title"></h1>
  <p id="gen"></p>
  <div class="demo-banner" id="demoBanner" style="display:none"></div>
</header>

<nav>
  <button id="tabStocks" class="on" onclick="tab('stocks')"><span id="tabStocksTxt"></span> <span id="refIcon" class="ref">↻</span></button>
  <button id="tabTasi" onclick="tab('tasi')"><span id="tabTasiTxt"></span></button>
  <button id="tabMacro" onclick="tab('macro')"><span id="tabMacroTxt"></span></button>
  <button id="tabAn" onclick="tab('an')"><span id="tabAnTxt"></span></button>
  <button id="tabCyc" onclick="tab('cyc')"><span id="tabCycTxt"></span></button>
</nav>

<div id="cycBox" style="display:none;max-width:640px;margin:22px auto 0;padding:0 20px">
  <div style="display:flex;gap:10px">
    <input id="cycInput" placeholder="AAPL · TSLA · 2222 · 1120" autocomplete="off"
      style="flex:1;padding:16px 20px;font-size:20px;border:1px solid var(--line);direction:ltr;
      border-radius:18px;background:var(--card);color:var(--txt);font-weight:700;text-align:center"
      onkeydown="if(event.key==='Enter')runCycle()">
    <button onclick="runCycle()" style="padding:16px 28px;font-size:20px;font-weight:800;
      border:none;border-radius:18px;background:var(--txt);color:#fff;cursor:pointer">🔍</button>
  </div>
  <div id="cycOut" style="margin-top:20px"></div>
</div>

<div class="chips" id="chips">
  <button data-f="all" class="on"></button>
  <button data-f="launch"></button>
  <button data-f="watch"></button>
  <button data-f="fav"></button>
  <select id="sortSel" class="sel" onchange="sortBy=this.value;renderStocks()"></select>
  <select id="secSel" class="sel" onchange="sector=this.value;renderStocks()"></select>
</div>

<main id="grid"></main>

<footer id="foot"></footer>

/* ======================= مكونات ======================= */
const STC = {launch:["b-launch","#34c759"],loaded:["b-launch","#34c759"],
             watch:["b-watch","#ff9500"],wait:["b-wait","#8e8e93"]};
const SIGC = ["#c62828","#ef5350","#9e9e9e","#66bb6a","#1b8b3f"];

/* تدرّج 5 مستويات: رمادي ضعيف → أزرق متوسط → أخضر قوي → برتقالي ممتاز → ذهبي نادر */
function maturityColor(score){
  return score>=85 ? "#e8b923"     // ذهبي — نادر
       : score>=80 ? "#f5a623"     // برتقالي — ممتاز
       : score>=65 ? "#22c37a"     // أخضر — قوي
       : score>=50 ? "#3b9be8"     // أزرق — متوسط
       :             "#9aa4b2";    // رمادي — ضعيف
}
/* شارة نصية للمستوى (تظهر تحت الرقم للنادر والممتاز) */
function maturityTag(score){
  const t=L();
  if(score>=85) return `<div class="rare">${t.rare}</div>`;
  if(score>=80) return `<div class="exc">${t.exc}</div>`;
  return "";
}
function ring(score){
  const color=maturityColor(score), r=48,c=2*Math.PI*r,off=c*(1-Math.min(score,100)/100);
  return `<div class="ring"><svg width="116" height="116">
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="#f2f2f7" stroke-width="10"/>
    <circle cx="58" cy="58" r="${r}" fill="none" stroke="${color}" stroke-width="10"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" stroke-linecap="round"/>
    </svg><div class="val" style="color:${color}">${score}</div></div>`;
}
/* شيك-ليست المراحل: ✓ خضراء لما تخطّاها · دائرة باهتة لو لا */
function checklist(items){
  const t=L();
  return `<div class="chk">${items.map(it=>{
    const lbl=lang==="en"?it.en:it.ar;
    return `<span class="chkitem ${it.ok?"ok":""}">${it.ok?"✓":"○"} ${lbl}</span>`;
  }).join("")}</div>`;
}
function speedo(g, live){
  const W=280,H=170,cx=W/2,cy=150,R=115;
  const p=a=>[cx+R*Math.cos(Math.PI*(1-a/180)), cy-R*Math.sin(Math.PI*(1-a/180))];
  const arc=(a1,a2,c)=>{const[x1,y1]=p(a1),[x2,y2]=p(a2);
    return `<path d="M ${x1} ${y1} A ${R} ${R} 0 0 1 ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="18" stroke-linecap="round"/>`};
  const needle = live ? g : 0;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%">
    ${arc(2,58,"#ff3b30")}${arc(64,116,"#d1d1d6")}${arc(122,178,"#34c759")}
    <g class="ndl" data-t="${needle}" data-cx="${cx}" data-cy="${cy}" transform="rotate(0 ${cx} ${cy})">
      <line x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy-R+30}" stroke="#1d1d1f" stroke-width="6" stroke-linecap="round"/>
      <circle cx="${cx}" cy="${cy}" r="12" fill="#1d1d1f"/></g>
    <text x="20" y="${H-4}" font-size="15" fill="#ff3b30" font-weight="700">DOWN</text>
    <text x="${W-46}" y="${H-4}" font-size="15" fill="#34c759" font-weight="700">UP</text></svg>`;
}
function sigIdx(m){
  const sc=(m.gauge||0)*0.5+(m.mom5||0)*3+(m.mom3||0)*4;
  return sc<=-45?0: sc<=-15?1: sc<15?2: sc<45?3:4;
}
function sigbar(m){
  const k=sigIdx(m), strong=(k===0||k===4);
  return `<div class="sigbar">${SIGC.map((c,i)=>`<i style="background:${c}" class="${i===k?"on":""}"></i>`).join("")}</div>
    <div class="siglabel ${strong?"sigpulse":""}" style="color:${SIGC[k]}">${L().sig[k]}</div>`;
}
function animateNeedles(){
  document.querySelectorAll("g.ndl").forEach(g=>{
    const t=+g.dataset.t, cx=g.dataset.cx, cy=g.dataset.cy, dur=1300, st=performance.now();
    function step(now){
      const p=Math.min(1,(now-st)/dur), e=1-Math.pow(1-p,3);
      const wob=p<1?Math.sin(p*14)*(1-p)*5:0;
      g.setAttribute("transform",`rotate(${t*e+wob} ${cx} ${cy})`);
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

function partsOf(s){
  // يدعم الشكل القديم {وايكوف:..} والجديد {w:..}
  const map={"وايكوف":"w","الحجم":"v","الاتجاه":"t","الدورة":"c","الأساسيات":"f"};
  const out={};
  for(const[k,val]of Object.entries(s.parts)) out[map[k]||k]=val;
  return out;
}
const CMP = {
  score:(a,b)=>b.score-a.score,
  priceAsc:(a,b)=>a.close-b.close,
  priceDesc:(a,b)=>b.close-a.close,
  eta:(a,b)=>((a.eta??99)-(b.eta??99))||b.score-a.score,
  volx:(a,b)=>(b.volx||0)-(a.volx||0),
  mc:(a,b)=>((a.mc||9e15)-(b.mc||9e15)),
};

  g.innerHTML=items.map(s=>{
    const [cls]=STC[s.status]||STC.wait;
    // الإشارات: نحذف ما يكرّر الشارة (اختراق/استمرار) ونُبقي البنيوية فقط، سطران كحد أقصى
    const rawSigs=(lang==="en"&&s.signals_en?s.signals_en:s.signals)||[];
    const sigs=rawSigs.filter(x=>!/^[🚀🔥✅🚫]/.test(x)).slice(0,2);

      : s.eta!==undefined ? `<div class="eta eta-far">${t.etaFar}</div>` : "";
    const plan=pick(s,"plan");
    const isSym=/^[A-Za-z.\-]+$/.test(s.ticker);
    const hasMc = s.mcap && s.mcap!=="—";
    let stkr="";
    if(s.earnings){
      const days=Math.ceil((new Date(s.earnings+"T16:00")-Date.now())/864e5);
      if(days>=0&&days<=45)
        stkr=`<div class="stkr ${days<=7?"hot":""}">${days===0?t.earnToday:t.earnIn(days)}</div>`;
    }
    return `<div class="card">

        <div class="tickrow"><div class="tick">${s.ticker}</div>
          <button class="favbtn ${favs.has(s.ticker)?"on":""}" onclick="toggleFav('${s.ticker}')" aria-label="fav">★</button></div>
        ${s.chg!==undefined?`<div class="px ${s.chg>=0?"up":"down"}"${!isStock?` data-live="${s.ticker}"`:""}>$${s.close} <span class="pct">${s.chg>=0?"▲":"▼"} ${Math.abs(s.chg)}%</span></div>`:`<div class="px">$${s.close}</div>`}
        ${(s.name&&s.name!==s.ticker)||s.sector?`<div class="nm">${[s.name!==s.ticker?s.name:"",s.sector?secName(s.sector):""].filter(Boolean).join(" · ")}</div>`:""}</div>
        <span class="badge ${cls}">${t.st[s.status]}</span></div>
      <div class="mid"><div style="text-align:center">${ring(s.score)}${maturityTag(s.score)}</div>
        <div class="chkwrap">${checklist(s.checklist||[])}${hasMc?`<div class="mcap">${t.mcap}: <b>${s.mcap}</b></div>`:""}</div></div>
      ${eta}
      ${plan?`<div class="plan">🎯 ${plan}</div>`:""}
      <div class="sigs">${sigs.slice(0,2).map(x=>`<div>${x}</div>`).join("")}</div>
      ${(s.tv||isSym)?`<a class="tvbtn" target="_blank"
        href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(s.tv||s.ticker)}">${t.tv}</a>`:""}
    </div>`;
  }).join("");
  mountQuotes();

/* بيانات البحث تأتي من الفحص السحابي (series.json) — بلا إنترنت خارجي ولا حجب */
let SERIES=null;   // سلاسل الأسعار المجهّزة من الفحص السحابي
async function loadSeries(){
  if(SERIES) return SERIES;
  try{ const r=await fetch("series.json",{cache:"no-store"}); if(r.ok) SERIES=await r.json(); }
  catch(e){ SERIES={}; }
  return SERIES||{};
}
/* بناء صفوف من سلسلة مضغوطة (أيام تداول متتابعة) */
function rowsFrom(entry){
  const start=new Date(entry.d0+"T00:00:00Z"), out=[];
  let d=new Date(start);
  for(let i=0;i<entry.p.length;i++){
    while(d.getUTCDay()===0||d.getUTCDay()===6) d.setUTCDate(d.getUTCDate()+1);
    const c=entry.p[i];
    out.push({d:new Date(d),c,l:c,h:c});
    d.setUTCDate(d.getUTCDate()+1);
  }
  return out;
}
async function fetchSeries(sym){
  const s=sym.trim().toUpperCase();
  const S=await loadSeries();
  // مطابقة مباشرة أو بلاحقة السوق (تاسي .SR)
  const key = S[s] ? s : (S[s+".SR"] ? s+".SR" : null);
  if(key) return {kind:key.endsWith(".SR")?"tasi":"stock", rows:rowsFrom(S[key]),
                  n:Object.keys(S).length};
  return null;
}
/* مقياس الاتجاهية Hurst — جوهر نظرية الفراكتال في الكتاب:
   >0.55 حركة اتجاهية تحترم مسارها · ~0.5 عشوائية · <0.45 ارتدادية متذبذبة */
function hurst(cl){
  const r=[]; for(let i=1;i<cl.length;i++) r.push(Math.log(cl[i]/cl[i-1]));
  const lags=[2,4,8,16,32,64].filter(l=>l<r.length/3);
  const X=[],Y=[];
  lags.forEach(lag=>{
    let s=0,n=0;
    for(let i=lag;i<r.length;i++){ let d=0; for(let j=0;j<lag;j++) d+=r[i-j]; s+=d*d; n++; }
    if(n>0){ X.push(Math.log(lag)); Y.push(Math.log(Math.sqrt(s/n))); }
  });
  const n=X.length; if(n<3) return 0.5;
  const mx=X.reduce((a,b)=>a+b)/n, my=Y.reduce((a,b)=>a+b)/n;
  let num=0,den=0; for(let i=0;i<n;i++){num+=(X[i]-mx)*(Y[i]-my);den+=(X[i]-mx)**2;}
  return den? Math.max(0.1,Math.min(0.95,num/den)) : 0.5;
}
/* كشف القيعان/القمم المحورية (فراكتال ويليامز: قاع أدنى من يومين قبله وبعده بمسافة) */
function pivots(rows,w){
  w=w||5; const lo=[],hi=[];
  for(let i=w;i<rows.length-w;i++){
    let isLo=true,isHi=true;
    for(let j=i-w;j<=i+w;j++){ if(rows[j].l<rows[i].l) isLo=false; if(rows[j].h>rows[i].h) isHi=false; }
    if(isLo) lo.push(i); if(isHi) hi.push(i);
  }
  return {lo,hi};
}
function fmtD(d){ return d.toISOString().slice(0,10); }
function analyzeCycle(rows){
  const cl=rows.map(x=>x.c);
  const P=pivots(rows,5);
  const lows=P.lo, highs=P.hi;
  const last=rows.length-1, price=cl[last];
  // أطوال الدورات السابقة: قاع → قاع
  const lens=[]; for(let i=1;i<lows.length;i++) lens.push(lows[i]-lows[i-1]);
  const avgLen=lens.length? Math.round(lens.reduce((a,b)=>a+b)/lens.length) : null;
  // الدورة الحالية تبدأ من آخر قاع محوري
  const lastLow=lows.length? lows[lows.length-1] : 0;
  const lastHigh=highs.length? highs[highs.length-1] : 0;
  const startIdx=lastLow, ageD=last-startIdx;
  const up = lastLow>lastHigh;                    // آخر محور قاع = دورة صاعدة
  const fromLow=(price/cl[lastLow]-1)*100;
  const fromHigh=lastHigh? (price/cl[lastHigh]-1)*100 : 0;
  // مرحلة الدورة
  let phase;
  if(up){ phase = ageD<=Math.max(8,(avgLen||40)*0.25) ? "early" : fromLow>60 ? "late" : "mid"; }
  else  { phase = ageD<=Math.max(8,(avgLen||40)*0.25) ? "dearly" : "dlate"; }
  // نافذة النضج المتوقعة (إسقاط إحصائي من دورات السهم نفسه — احتمال لا موعد)
  let win=null;
  if(avgLen){
    const sd=lens.length>1? Math.sqrt(lens.map(x=>(x-avgLen)**2).reduce((a,b)=>a+b)/lens.length) : avgLen*0.25;
    const lo=Math.max(0,Math.round(avgLen-sd-ageD)), hi=Math.round(avgLen+sd-ageD);
    if(hi>0) win={lo:Math.max(0,lo),hi,
      d1:fmtD(new Date(rows[last].d.getTime()+Math.max(0,lo)*864e5)),
      d2:fmtD(new Date(rows[last].d.getTime()+hi*864e5))};
  }
  return {price,up,phase,ageD,avgLen,lens:lens.slice(-4),win,
    startDate:fmtD(rows[startIdx].d), startPrice:cl[startIdx],
    fromLow:+fromLow.toFixed(1), fromHigh:+fromHigh.toFixed(1),
    H:+hurst(cl).toFixed(2), nCycles:lens.length,
    lastDate:fmtD(rows[last].d)};
}
async function runCycle(){
  const sym=(document.getElementById("cycInput").value||"").trim().toUpperCase();
  const out=document.getElementById("cycOut"), t=L();
  if(!sym){ out.innerHTML=""; return }
  out.innerHTML=`<div class="empty" style="padding:30px">⏳ ${t.cycLoad} ${sym}…</div>`;
  const data=await fetchSeries(sym);
  if(!data){
    const S=await loadSeries(), keys=Object.keys(S);
    const sug=keys.filter(k=>k.startsWith(sym.slice(0,2))).slice(0,8).map(k=>k.replace(".SR",""));
    out.innerHTML=`<div class="empty" style="padding:30px;font-size:19px">${t.cycFail}
      ${keys.length?`<div style="margin-top:14px;font-size:16px">${t.cycAvail}: ${keys.length}
        ${sug.length?`<div class="chiprow" style="justify-content:center;margin-top:10px">
          ${sug.map(k=>`<a class="chip" href="#" onclick="document.getElementById('cycInput').value='${k}';runCycle();return false">${k}</a>`).join("")}</div>`:""}
      </div>`:""}</div>`;
    return }
  const a=analyzeCycle(data.rows);
  const PH={early:[t.phEarly,"#1b8b3f","#e8f8ee"], mid:[t.phMid,"#0a58c2","#eef4ff"],
            late:[t.phLate,"#b36b00","#fff4e5"], dearly:[t.phDEarly,"#c22","#ffeceb"],
            dlate:[t.phDLate,"#6e6e73","#f2f2f7"]};
  const [phTxt,phCol,phBg]=PH[a.phase]||PH.mid;
  const hTxt = a.H>=0.55? t.hTrend : a.H<=0.45? t.hMean : t.hRandom;
  const chk=(ok,label)=>`<span class="chkitem ${ok?"ok":""}">${ok?"✓":"○"} ${label}</span>`;
  out.innerHTML=`<div class="card">
    <div class="top"><div><div class="tick">${sym}</div>
      <div class="nm">${data.kind==="tasi"?"🇸🇦 تاسي":"🇺🇸 US"} · ${a.lastDate}</div></div>
      <span class="badge" style="background:${phBg};color:${phCol}">${phTxt}</span></div>
    <div class="px ${a.up?"up":"down"}" style="margin-top:10px">$${a.price.toFixed(a.price<1?5:2)}
      <span class="pct">${a.up?"▲":"▼"} ${Math.abs(a.up?a.fromLow:a.fromHigh)}% ${t.cycFromPivot}</span></div>
    <div class="chk" style="margin-top:16px">
      ${chk(a.up,a.up?t.cycUpTrend:t.cycDownTrend)}
      ${chk(a.phase==="early"||a.phase==="dearly",t.cycEarly)}
      ${chk(a.H>=0.55,`${t.cycTrendy} (H=${a.H} · ${hTxt})`)}
      ${chk(!!a.avgLen,t.cycHasHistory)}
    </div>
    <div class="plan" style="background:#eef4ff;color:#0a58c2;margin-top:16px">
      📅 <b>${t.cycStart}:</b> ${a.startDate} ($${a.startPrice.toFixed(2)})<br>
      ⏱ <b>${t.cycAge}:</b> ${a.ageD} ${t.cycDays}
      ${a.avgLen?` · <b>${t.cycAvg}:</b> ${a.avgLen} ${t.cycDays} (${a.nCycles} ${t.cycPrev})`:""}
    </div>
    ${a.win?`<div class="plan" style="margin-top:12px">🎯 <b>${t.cycWindow}:</b> ${a.win.d1} → ${a.win.d2}
      <span style="font-weight:400">(${t.cycIn} ${a.win.lo}–${a.win.hi} ${t.cycDays})</span></div>`:""}
    ${a.lens.length?`<div class="sigs"><div>${t.cycPrevLens}: ${a.lens.join(" · ")} ${t.cycDays}</div></div>`:""}
    <div class="annote" style="margin-top:10px">${t.cycNote}</div>
    <a class="tvbtn" target="_blank" href="https://www.tradingview.com/chart/?symbol=${encodeURIComponent(sym)}">${t.tv}</a>
  </div>`;
}

    setTimeout(()=>icon.classList.remove("spin"), 700);
  }
  view=v;
  document.getElementById("tabStocks").classList.toggle("on",v==="stocks");
  document.getElementById("tabTasi").classList.toggle("on",v==="tasi");
  document.getElementById("tabCyc").classList.toggle("on",v==="cyc");

  document.getElementById("tabAn").classList.toggle("on",v==="an");

  document.getElementById("chips").style.display=(v==="stocks"||v==="tasi")?"flex":"none";
  document.getElementById("secSel").style.display=v==="tasi"?"none":"";
  document.getElementById("cycBox").style.display=v==="cyc"?"block":"none";
  document.getElementById("grid").style.display=v==="cyc"?"none":"grid";
  if(v==="stocks"){renderStocks()}

  else if(v==="macro"){renderMacro();animateNeedles()}
  else if(v==="cyc"){ setTimeout(()=>document.getElementById("cycInput").focus(),100) }
  else{renderAnalysis()}
}
